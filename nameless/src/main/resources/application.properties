# ========== 应用基础 ==========
spring.application.name=nameless
server.port=8080
# TCP 等待队列长度。Tomcat 默认 100：150 个客户端同时建连时，多余的 SYN 会被直接拒绝
# （客户端看到 connect refused，服务端没有任何异常日志）。压测到 150 并发时踩过这个坑。
server.tomcat.accept-count=300

# ========== 数据源（MySQL 9.5） ==========
spring.datasource.url=jdbc:mysql://localhost:3306/nameless_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:123123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 连接池（HikariCP，Spring Boot 默认）
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=NamelessHikariPool

# ========== MyBatis-Plus ==========
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=com.opsorder.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.cache-enabled=false
# mybatis-plus.configuration.log-impl
# （已移除 StdOutImpl：开发期都不该把 SQL 打到 stdout，改为默认 Slf4j 日志）
# 全局 id-type 与 User 实体的 @TableId(type = IdType.AUTO) 冲突，注解优先级更高会覆盖此处。
# 为避免误导，改为与实体一致的 AUTO（数据库自增主键）
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0


# ========== Redis ==========
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=5000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=-1ms

# ========== Sa-Token ==========
sa-token.token-name=satoken
sa-token.timeout=2592000
sa-token.active-timeout=-1
sa-token.is-concurrent=true
sa-token.is-share=true  
sa-token.token-style=uuid
sa-token.is-log=true
# Sa-Token 会话数据存到 Redis（整合 sa-token-redis-template 后生效），重启后登录态不丢
sa-token.dao-type=redis

# ========== RocketMQ（暂时停用，pom 中 rocketmq-spring-boot-starter 已注释） ==========
# 注意：rocketmq-spring-boot 2.2.3 只通过 META-INF/spring.factories 注册自动配置，
# Spring Boot 3+ 不再读取该文件，在 Boot 4.1.1 下这些配置不会生效。
